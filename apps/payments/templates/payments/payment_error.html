{% extends 'base_luxury.html' %}
{% block title %}Payment Failed — BharatKart{% endblock %}

{% block content %}
<div class="container py-5" style="min-height: 60vh; display: flex; align-items: center;">
    <div style="text-align: center; width: 100%;" data-aos="zoom-in">
        <div style="width: 140px; height: 140px; margin: 0 auto 32px; border-radius: 50%; background: linear-gradient(135deg, var(--burgundy) 0%, #8b2938 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 4rem; box-shadow: 0 30px 80px rgba(107,31,44,0.35);">
            <i class="fas fa-times"></i>
        </div>
        
        <div class="section-eyebrow" style="color: var(--burgundy);">Payment Failed</div>
        <h1 class="section-title">Something <span class="gold-text">Went Wrong</span></h1>
        <p class="section-subtitle" style="margin-bottom: 32px;">
            We couldn't process your payment. Please try again or use a different method.
        </p>
        
        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'cart:detail' %}" class="btn-luxury btn-luxury-primary">
                <i class="fas fa-redo"></i> <span>Try Again</span>
            </a>
            <a href="/" class="btn-luxury btn-luxury-outline">
                <i class="fas fa-home"></i> <span>Back Home</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
