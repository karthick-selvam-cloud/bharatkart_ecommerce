version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bharatkart_mysql
    restart: always
    environment:
      MYSQL_DATABASE: bharatkart_db
      MYSQL_USER: bharatkart_user
      MYSQL_PASSWORD: your_secure_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bharatkart_network

  redis:
    image: redis:7-alpine
    container_name: bharatkart_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bharatkart_network

  web:
    build: .
    container_name: bharatkart_web
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 ecommerce.asgi:application
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=ecommerce.settings.development
      - DB_HOST=mysql
      - DB_NAME=bharatkart_db
      - DB_USER=bharatkart_user
      - DB_PASSWORD=your_secure_password
      - REDIS_URL=redis://redis:6379/0
    networks:
      - bharatkart_network

  celery_worker:
    build: .
    container_name: bharatkart_celery
    restart: always
    command: celery -A ecommerce worker -l info
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=ecommerce.settings.development
      - DB_HOST=mysql
      - DB_NAME=bharatkart_db
      - DB_USER=bharatkart_user
      - DB_PASSWORD=your_secure_password
      - REDIS_URL=redis://redis:6379/0
    networks:
      - bharatkart_network

  celery_beat:
    build: .
    container_name: bharatkart_beat
    restart: always
    command: celery -A ecommerce beat -l info
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=ecommerce.settings.development
      - DB_HOST=mysql
      - DB_NAME=bharatkart_db
      - DB_USER=bharatkart_user
      - DB_PASSWORD=your_secure_password
      - REDIS_URL=redis://redis:6379/0
    networks:
      - bharatkart_network

  nginx:
    image: nginx:alpine
    container_name: bharatkart_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - bharatkart_network

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  bharatkart_network:
    driver: bridge